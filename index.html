<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cost Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header>
    <h1>🔧 Cost Calculator</h1>
    <p>คำนวณต้นทุนงานช่าง</p>
  </header>

  <!-- ข้อมูลงาน -->
  <div class="card job-info">

    <label>
      ชื่องาน
      <input id="jobName" type="text" placeholder="เช่น แร็คข้าง CRF300L">
    </label>

    <label>
      รายละเอียดงาน
      <textarea id="jobDetail" rows="4"
        placeholder="รายละเอียดของงาน เช่น วัสดุที่ใช้ ลักษณะงาน สี หรือหมายเหตุ"></textarea>
    </label>

    <label>
      รูปงาน
      <input id="jobImage" type="file" accept="image/*">
    </label>

    <div id="imagePreview" class="image-preview"></div>

  </div>

  <!-- วัสดุ -->
  <div class="card">

    <div class="bar">
      <h2>วัสดุ</h2>
      <button type="button" id="add">＋ เพิ่มวัสดุ</button>
    </div>

    <div id="materials"></div>

  </div>

  <!-- ค่าแรง -->
  <div class="card">

    <h2>ค่าแรง</h2>

    <div class="labor-grid">

      <label>
        ความยาก
        <select id="difficulty">
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>

      <label>
        ค่าแรง (บาท)
        <input id="labor" type="number" min="0" value="0">
      </label>

    </div>

  </div>

  <!-- ราคาขาย -->
  <div class="card">

    <label>
      ราคาขาย
      <input id="selling" type="number" min="0" placeholder="บาท">
    </label>

  </div>

  <!-- สรุป -->
  <div class="summary">

    <div>
      วัสดุ
      <strong id="mat">฿0.00</strong>
    </div>

    <div>
      ค่าแรง
      <strong id="lab">฿0.00</strong>
    </div>

    <div class="dark">
      ต้นทุนรวม
      <strong id="total">฿0.00</strong>
    </div>

    <div class="profit">
      กำไร
      <strong id="profit">฿0.00</strong>
    </div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>

</body>
</html>
